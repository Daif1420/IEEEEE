services:
  - type: web
    name: iems-dashboard
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        sync: false   # set this manually in the Render dashboard - don't commit it
    disk:
      name: iems-db
      mountPath: /app/db
      sizeGB: 1
