<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intercom IEMS | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-blue: #0052cc;
    --accent-red: #e53935;
    --accent-yellow: #ffb300;
    --bg-dark: #0a192f;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    background-color: var(--card-bg);
  }

  /* الحاوية الرئيسية للتصميم المقسوم */
  .login-wrapper {
    display: flex;
    width: 100vw;
    min-height: 100vh;
  }

  /* النصف الأيمن/الأيسر الملون (الجانب الترحيبي) */
  .hero-side {
    flex: 1;
    background: radial-gradient(circle at 80% 20%, #1e3a8a 0%, var(--bg-dark) 100%);
    color: #ffffff;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  /* أشكال خلفية ناعمة داخل الجزء الملون */
  .hero-side::before, .hero-side::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
  }
  .hero-side::before {
    width: 300px;
    height: 300px;
    background: rgba(229, 57, 53, 0.2);
    top: 10%;
    right: 10%;
  }
  .hero-side::after {
    width: 350px;
    height: 350px;
    background: rgba(255, 179, 0, 0.15);
    bottom: 10%;
    left: 10%;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    margin: auto 0;
    max-width: 480px;
  }

  .hero-icon {
    font-size: 3rem;
    margin-bottom: 24px;
    color: var(--accent-yellow);
  }

  .hero-title {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 20px;
  }

  .hero-sub {
    font-size: 1.05rem;
    color: #94a3b8;
    line-height: 1.7;
  }

  .hero-footer {
    position: relative;
    z-index: 1;
    font-size: 0.85rem;
    color: #64748b;
  }

  /* النصف الخاص بنموذج الدخول */
  .form-side {
    width: 480px;
    max-width: 100%;
    background: var(--card-bg);
    padding: 60px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .logo-container {
    margin-bottom: 32px;
  }

  .logo-container img {
    max-width: 180px;
    height: auto;
    object-fit: contain;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--primary-blue);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  .login-brand .dot {
    width: 8px;
    height: 8px;
    background-color: var(--accent-red);
    border-radius: 50%;
    display: inline-block;
  }

  h1 {
    font-size: 1.8rem;
    color: var(--text-main);
    font-weight: 700;
    margin-bottom: 8px;
  }

  p.sub {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border-color);
    border-radius: 12px;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.25s ease;
    background-color: #f8fafc;
  }

  .field input:focus {
    border-color: var(--primary-blue);
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1);
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--primary-blue);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 16px -4px rgba(0, 82, 204, 0.3);
  }

  .login-btn:hover {
    background-color: #0041a3;
    transform: translateY(-2px);
    box-shadow: 0 12px 20px -4px rgba(0, 82, 204, 0.4);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-error {
    margin-top: 16px;
    color: var(--accent-red);
    font-size: 0.85rem;
    text-align: center;
    font-weight: 600;
  }

  /* تجاوب التصميم مع الشاشات الصغيرة */
  @media (max-width: 900px) {
    .login-wrapper {
      flex-direction: column;
    }
    .hero-side {
      display: none; /* إخفاء الجزء الجانبي في الموبايل لتركيز التجربة */
    }
    .form-side {
      width: 100%;
      min-height: 100vh;
      padding: 40px 24px;
    }
  }
</style>
</head>
<body>

<div class="login-wrapper">

  <!-- الجانب الأيسر: القسم الترحيبي (مثل تصميم الصورة) -->
  <div class="hero-side">
    <div class="hero-content">
      <div class="hero-icon">✱</div>
      <h2 class="hero-title">مرحباً بك في نظام Intercom IEMS 👋</h2>
      <p class="hero-sub">تابع وأدر بيانات الأداء الخاصة بك بكفاءة وسرعة من خلال منصة واحدة متكاملة.</p>
    </div>
    <div class="hero-footer">
      &copy; 2026 Intercom IEMS. جميع الحقوق محفوظة.
    </div>
  </div>

  <!-- الجانب الأيمن: نموذج تسجيل الدخول -->
  <div class="form-side">
    
    <div class="logo-container">
      <img src="logo.png" alt="Intercom Logo">
    </div>

    <div class="login-brand">
      <span class="dot"></span>
      <span>IEMS &middot; SHIFT A</span>
    </div>

    <h1>أهلاً بك مجدداً!</h1>
    <p class="sub">أدخل الرقم التعريفي (ID) وكلمة المرور لعرض بيانات الأداء الخاصة بك.</p>
    
    <div class="field">
      <label for="login-id">الرقم التعريفي (ID)</label>
      <input type="text" id="login-id" inputmode="numeric" placeholder="مثال: 1026" autocomplete="username">
    </div>

    <div class="field">
      <label for="login-pass">كلمة المرور</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn">دخول الان</button>
    <div class="login-error" id="login-error"></div>

  </div>

</div>

<script src="app-login.js"></script>
</body>
</html>
