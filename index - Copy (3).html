<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intercom IEMS | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-blue: #3b82f6;
    --primary-blue-dark: #2563eb;
    --accent-red: #e53935;
    --accent-yellow: #ffb300;
    --bg-dark: #0a192f;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --side-bg: #f8fafc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
  }

  /* قفل السكرول بشكل كاملي */
  html, body {
    width: 100%;
    height: 100%;
    max-height: 100vh;
    overflow: hidden !important;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 80% 20%, #1e3a8a 0%, var(--bg-dark) 100%);
    position: relative;
  }

  /* أشكال خلفية جمالية مدمجة */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
  }
  body::before {
    width: 300px;
    height: 300px;
    background: rgba(229, 57, 53, 0.15);
    top: 10%;
    right: 15%;
  }
  body::after {
    width: 350px;
    height: 350px;
    background: rgba(255, 179, 0, 0.12);
    bottom: 10%;
    left: 15%;
  }

  /* الكارت الرئيسي بالمنتصف */
  .main-card {
    display: flex;
    width: 100%;
    max-width: 860px;
    max-height: calc(100vh - 32px);
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* النصف الأيمن: نموذج الدخول */
  .form-side {
    flex: 1;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .logo-container {
    text-align: center;
    margin-bottom: 12px;
  }

  .logo-container img {
    max-width: 150px;
    height: auto;
    object-fit: contain;
  }

  .login-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary-blue);
    margin-bottom: 8px;
  }

  .login-brand .dot {
    width: 8px;
    height: 8px;
    background-color: var(--accent-red);
    border-radius: 50%;
  }

  h1 {
    font-size: 1.4rem;
    color: var(--text-main);
    text-align: center;
    font-weight: 700;
    margin-bottom: 4px;
  }

  p.sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 4px;
  }

  .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-color);
    border-radius: 10px;
    font-size: 0.88rem;
    outline: none;
    transition: all 0.25s ease;
    background-color: #f8fafc;
  }

  .field input:focus {
    border-color: var(--primary-blue);
    background-color: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .login-btn {
    width: 100%;
    padding: 11px;
    background-color: var(--primary-blue);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.3s ease;
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
  }

  .login-btn:hover {
    background-color: var(--primary-blue-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-error {
    margin-top: 8px;
    color: var(--accent-red);
    font-size: 0.82rem;
    text-align: center;
    font-weight: 600;
  }

  /* النصف الأيسر: القسم الترحيبي (بدون النقاط التي بالأسفل) */
  .info-side {
    flex: 1;
    background-color: var(--side-bg);
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-right: 1px solid var(--border-color);
  }

  .info-side h2 {
    font-size: 1.35rem;
    color: var(--text-main);
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .info-side p {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 300px;
  }

  /* التجاوب مع الموبايل */
  @media (max-width: 820px) {
    .main-card {
      flex-direction: column;
      max-width: 400px;
    }
    .info-side {
      display: none;
    }
    .form-side {
      padding: 28px 20px;
    }
  }
</style>
</head>
<body>

<div class="main-card">
  
  <!-- النصف الأيمن: نموذج الدخول -->
  <div class="form-side">
    
    <div class="logo-container">
      <img src="logo.png" alt="Intercom Logo">
    </div>

    <div class="login-brand">
      <span class="dot"></span>
      <span>IEMS &middot; SHIFT A</span>
    </div>

    <h1>تسجيل الدخول</h1>
    <p class="sub">أدخل الرقم التعريفي (ID) وكلمة المرور لعرض بيانات الأداء الخاصة بك.</p>
    
    <div class="field">
      <label for="login-id">الرقم التعريفي (ID)</label>
      <input type="text" id="login-id" inputmode="numeric" placeholder="مثال: 1026" autocomplete="username">
    </div>

    <div class="field">
      <label for="login-pass">كلمة المرور</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn">دخول</button>
    <div class="login-error" id="login-error"></div>

  </div>

  <!-- النصف الأيسر: القسم الترحيبي -->
  <div class="info-side">
    <h2>مرحباً بك في نظام Intercom IEMS 👋</h2>
    <p>تابع وأدر بيانات الأداء الخاصة بك بكفاءة وسرعة من خلال منصة واحدة متكاملة.</p>
  </div>

</div>

<script src="app-login.js"></script>
</body>
</html>
